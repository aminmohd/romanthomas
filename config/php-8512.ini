; PHP 8.5.12 configuration for roman-thomas CI4 only.
; Loaded via PHPRC from bin/php, ./spark, and ./serve — not global LAMPP/php.ini.

extension=/opt/lampp/htdocs/roman-thomas/php-extensions/intl.so
mysqli.default_socket=/opt/lampp/var/mysql/mysql.sock
memory_limit=512M
display_errors=On
error_reporting=E_ALL
